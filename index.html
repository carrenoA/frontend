<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Systems | Management Hub</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="/static/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/main.js" defer></script>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#F9FAFB]" x-data>

    <div id="app-container" class="min-h-screen" x-init="
            const path = window.location.pathname;
            // Si la URL es el dashboard o proyectos, cargamos ese fragmento
            if (path.includes('dashboard.html') || path.includes('projects')) {
                htmx.ajax('GET', path, { target: '#app-container', pushUrl: false });
            } else {
                // Por defecto cargamos el login
                htmx.ajax('GET', '/src/views/auth/login.html', { target: '#app-container', pushUrl: false });
            }
         ">
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#0D3BBD]"></div>
        </div>
    </div>

</body>

</html>
