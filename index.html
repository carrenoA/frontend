<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt</title>

    <script>
        // Paths for GitHub Pages
        (function () {
            const path = window.location.pathname;
            const base = path.endsWith('/') ? path : path.substring(0, path.lastIndexOf('/') + 1);
            document.write('<base href="' + window.location.origin + base + '">');
        })();
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/libs/frappe-gantt/frappe-gantt.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="static/js/htmx.min.js" defer></script>
    <script src="static/libs/frappe-gantt/frappe-gantt.umd.js" defer></script>
    <script src="static/js/main.js" defer></script>

    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="bg-[#F9FAFB]" x-data hx-indicator="#global-spinner">

    <!-- Global CSS for HTMX indicators -->
    <style>
        .htmx-indicator {
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease-in;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
            pointer-events: auto;
        }

        .htmx-request.htmx-indicator {
            opacity: 1;
            pointer-events: auto;
        }
    </style>

    <!-- Global Spinner -->
    <div id="global-spinner"
        class="htmx-indicator fixed inset-0 z-[9999] bg-white/60 backdrop-blur-sm flex items-center justify-center">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-gray-200 border-t-[#0D3BBD] shadow-xl"></div>
    </div>

    <!-- Dummy target to prevent HTMX error when overriding indicator -->
    <div id="no-indicator" class="hidden"></div>

    <div id="app-container" class="min-h-screen" x-init="
            const path = window.location.pathname;
            if (path.includes('dashboard.html') || path.includes('projects')) {
                htmx.ajax('GET', path, { target: '#app-container', pushUrl: false });
            } else {
                htmx.ajax('GET', 'src/views/auth/login.html', { target: '#app-container', pushUrl: false });
            }
         ">
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#0D3BBD]"></div>
        </div>
    </div>

    <!-- Global Toasts / Tooltips -->
    <div x-data="{ 
            toasts: [],
            addToast(e) {
                const id = Date.now();
                this.toasts.push({ id, message: e.detail.message, type: e.detail.type || 'info' });
                this.$nextTick(() => { if(window.lucide) lucide.createIcons() });
            },
            removeToast(id) {
                this.toasts = this.toasts.filter(t => t.id !== id);
            }
         }" @notify.window="addToast"
        class="fixed bottom-6 right-6 z-[99999] flex flex-col gap-3 max-w-sm pointer-events-none">

        <template x-for="toast in toasts" :key="toast.id">
            <div x-data="{ show: false }" x-init="
                    setTimeout(() => show = true, 50);
                    setTimeout(() => { show = false; setTimeout(() => removeToast(toast.id), 300) }, 4000);
                 " x-show="show" x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-y-8 scale-95"
                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                x-transition:leave-end="opacity-0 translate-y-8 scale-95"
                class="pointer-events-auto flex items-center gap-4 px-5 py-4 bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100">

                <div class="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center font-bold" :class="{
                         'bg-green-50 text-green-600 border border-green-100': toast.type === 'success',
                         'bg-red-50 text-red-600 border border-red-100': toast.type === 'error',
                         'bg-blue-50 text-blue-600 border border-blue-100': toast.type === 'info',
                         'bg-orange-50 text-orange-500 border border-orange-100': toast.type === 'warning'
                     }">
                    <i :data-lucide="(
                         toast.type === 'success' ? 'check-circle' :
                         toast.type === 'error' ? 'alert-triangle' :
                         toast.type === 'warning' ? 'alert-circle' : 'info'
                     )" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <p class="text-xs font-bold text-gray-900" x-text="toast.message"></p>
                </div>
                <button @click="show = false; setTimeout(() => removeToast(toast.id), 300)"
                    class="text-gray-400 hover:text-gray-900 transition-colors bg-gray-50 hover:bg-gray-100 p-1.5 rounded-lg">
                    <i data-lucide="x" class="w-3 h-3"></i>
                </button>
            </div>
        </template>
    </div>

</body>

</html>
