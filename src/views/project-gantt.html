                        </div>

                        <div class="space-y-2">
                            <label
                                class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Attachments</label>
                            <div class="relative group">
                                <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                <div
                                    class="w-full px-6 py-4 bg-gray-50 border-2 border-dashed border-gray-200 rounded-[1.2rem] text-sm flex items-center gap-3 text-gray-400 group-hover:border-[#0D3BBD] transition-colors">
                                    <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                                    <span class="font-bold">Drop files or click to upload</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button @click="showPublishModal = false; selectedTaskId = ''"

        <!-- Add Activity Modal -->
        <div x-show="showActivityModal"
            class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm"
            x-transition.opacity x-cloak>
            <div @click.away="showActivityModal = false"
                class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl relative p-8 animate-in zoom-in duration-300">
                <button @click="showActivityModal = false"
                    class="absolute top-6 right-6 text-gray-400 hover:text-gray-900 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <div class="mb-6">
                    <span
                        class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-bold uppercase rounded-full mb-3">NEW
                        ACTIVITY</span>
                    <h2 class="text-2xl font-bold text-gray-900">Add Activity</h2>
                </div>
                <form class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block ml-1">Activity

                            class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-100 outline-none text-gray-700 font-medium">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label
                                class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block ml-1">Start
                                Date</label>
                            <input type="date"
                                class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-100 outline-none text-gray-700 font-medium [&::-webkit-calendar-picker-indicator]:opacity-50">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block ml-1">End
                                Date</label>
                            <input type="date"
                                class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-100 outline-none text-gray-700 font-medium [&::-webkit-calendar-picker-indicator]:opacity-50">
                        </div>
                    </div>
                    <div class="pt-4">
                        <button type="button" @click="showActivityModal = false"
                            class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 transition-colors">
                            Commit Activity
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Task Modal -->
        <div x-show="showTaskModal"
            class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm"
            x-transition.opacity x-cloak>
            <div @click.away="showTaskModal = false"
                class="bg-white w-full max-w-sm rounded-[2rem] shadow-2xl relative p-8 animate-in zoom-in duration-300">
                <button @click="showTaskModal = false"
                    class="absolute top-6 right-6 text-gray-400 hover:text-gray-900 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <div class="mb-6">
                    <span
                        class="inline-block px-3 py-1 bg-blue-50 text-[#0D3BBD] text-[10px] font-bold uppercase rounded-full mb-3">NEW
                        TASK</span>
                    <h2 class="text-2xl font-bold text-gray-900">Add Task</h2>
                </div>
                <form class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block ml-1">Task
                            Name</label>
                        <input type="text" placeholder="Task Name"
                            class="w-full px-4 py-3 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-100 outline-none text-gray-700 font-medium">
                    </div>
                    <div class="space-y-1.5">
                        <label
                            class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block ml-1">Assignee</label>
                        <div class="relative group">
                            <i data-lucide="user"
                                class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 z-10 pointer-events-none"></i>
                            <select

                                <option value="">Select Assignee</option>
                                <option value="sj">Sarah Jenkins</option>
                                <option value="mc">Marcus Doe</option>
                            </select>
                            <i data-lucide="chevron-down"
                                class="w-4 h-4 text-gray-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="pt-4">
                        <button type="button" @click="showTaskModal = false"

<style>
    .gantt .bar-wrapper.parent-bar .bar-label {
        fill: white !important;
        font-weight: bold;
    }

    .gantt .bar-wrapper.child-bar .bar-label {
        fill: #374151 !important;
        font-weight: bold;
    }

    [x-cloak] {
        display: none !important;
    }
</style>

<script>
    function ganttLogic() {
        return {
            viewMode: 'Week',
            gantt: null,
            showPublishModal: false,
            showActivityModal: false,
            showTaskModal: false,
            taskTargetActivity: '',
            selectedTaskId: '',
            openTaskModal(activityId) {
                this.taskTargetActivity = activityId;
                this.showTaskModal = true;
            },
            tasks: [
                { id: 'P1', name: 'Concept Phase', start: '2026-09-15', end: '2026-09-25', progress: 50, isParent: true, dependencies: '', custom_class: 'parent-bar' },
                { id: 'T1', name: 'Market Analysis', start: '2026-09-15', end: '2026-09-18', progress: 100, avatar: 'https://i.pravatar.cc/150?u=1', colorClass: 'bg-green-500', isParent: false, dependencies: 'P1', custom_class: 'child-bar' },
                { id: 'T2', name: 'User Interviews', start: '2026-09-19', end: '2026-09-25', progress: 0, avatar: 'https://i.pravatar.cc/150?u=2', colorClass: 'bg-blue-500', isParent: false, dependencies: 'P1, T1', custom_class: 'child-bar' },
                { id: 'P2', name: 'Design System', start: '2026-09-25', end: '2026-10-02', progress: 24, isParent: true, dependencies: '', custom_class: 'parent-bar' },
                { id: 'T3', name: 'Fluid Component Library', start: '2026-09-25', end: '2026-09-29', progress: 50, avatar: 'https://i.pravatar.cc/150?u=3', colorClass: 'bg-[#984a1e]', isParent: false, dependencies: 'P2', custom_class: 'child-bar' },
                { id: 'T4', name: 'Iconography Set', start: '2026-09-30', end: '2026-10-02', progress: 0, avatar: 'https://i.pravatar.cc/150?u=4', colorClass: 'bg-gray-400', isParent: false, dependencies: 'P2, T3', custom_class: 'child-bar' },
                { id: 'P3', name: 'Backend Architecture', start: '2026-10-05', end: '2026-10-15', progress: 0, isParent: true, dependencies: '', custom_class: 'parent-bar' },
                { id: 'P4', name: 'Frontend Development', start: '2026-10-10', end: '2026-10-25', progress: 0, isParent: true, dependencies: '', custom_class: 'parent-bar' },
                { id: 'T5', name: 'UI Implementation', start: '2026-10-10', end: '2026-10-15', progress: 0, avatar: 'https://i.pravatar.cc/150?u=5', colorClass: 'bg-green-500', isParent: false, dependencies: 'P4', custom_class: 'child-bar' },
                { id: 'T6', name: 'State Management', start: '2026-10-16', end: '2026-10-20', progress: 0, avatar: 'https://i.pravatar.cc/150?u=1', colorClass: 'bg-indigo-500', isParent: false, dependencies: 'P4, T5', custom_class: 'child-bar' },
                { id: 'T7', name: 'API Integration', start: '2026-10-21', end: '2026-10-25', progress: 0, avatar: 'https://i.pravatar.cc/150?u=2', colorClass: 'bg-purple-500', isParent: false, dependencies: 'P4, T6', custom_class: 'child-bar' },
                { id: 'P5', name: 'Quality Assurance', start: '2026-10-26', end: '2026-11-05', progress: 0, isParent: true, dependencies: '', custom_class: 'parent-bar' },
                { id: 'T8', name: 'Unit Testing', start: '2026-10-26', end: '2026-10-31', progress: 0, avatar: 'https://i.pravatar.cc/150?u=3', colorClass: 'bg-red-500', isParent: false, dependencies: 'P5', custom_class: 'child-bar' },
                { id: 'T9', name: 'E2E Testing', start: '2026-11-01', end: '2026-11-05', progress: 0, avatar: 'https://i.pravatar.cc/150?u=4', colorClass: 'bg-yellow-500', isParent: false, dependencies: 'P5, T8', custom_class: 'child-bar' }
            ],
            initGantt() {
                this.$nextTick(() => {
                    const ganttTasks = this.tasks.map(t => ({
                        id: t.id, name: t.name, start: t.start, end: t.end,
                        progress: t.progress, dependencies: t.dependencies, custom_class: t.custom_class
                    }));
                    if (typeof Gantt !== 'undefined') {
                        this.gantt = new Gantt("#gantt-target", ganttTasks, {
                            view_mode: this.viewMode, language: 'en', bar_height: 30, padding: 30,
                            custom_popup_html: (task) => {
                                return `<div class="p-2 bg-white rounded-lg shadow-xl border border-gray-100 min-w-[120px] z-[9999]">
                                            <p class="font-bold text-xs text-gray-900 mb-1">${task.name}</p>
                                            <p class="text-[10px] text-blue-600 font-black">${task.progress}% complete</p>
                                        </div>`;
                            }
                        });
                        this.setupDragToPan();
                    }
                    lucide.createIcons();
                });
            },
            changeView(mode) {
                this.viewMode = mode;
                if (this.gantt) {
                    this.gantt.change_view_mode(mode);
                    setTimeout(() => this.setupDragToPan(), 100);
                }
            },
            setupDragToPan() {
                const container = document.querySelector('.gantt-container');
                if (!container) return;
                let isDown = false; let startX; let scrollLeft;
                container.style.cursor = 'grab';
                container.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.bar-wrapper') || e.target.closest('.handle-group')) return;
                    isDown = true; container.style.cursor = 'grabbing';
                    startX = e.pageX - container.offsetLeft; scrollLeft = container.scrollLeft;
                });
                container.addEventListener('mouseleave', () => { isDown = false; container.style.cursor = 'grab'; });
                container.addEventListener('mouseup', () => { isDown = false; container.style.cursor = 'grab'; });
                container.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - container.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    container.scrollLeft = scrollLeft - walk;
                });
            }
        }
    }
</script>
