<section class="min-h-screen flex items-center justify-center p-6 bg-[#F9FAFB] animate-in fade-in duration-500">

    <div x-data="loginHandler" class="card w-full max-w-[420px] relative">

        <template x-if="error">
            <div
                class="absolute -top-12 left-0 right-0 bg-red-500 text-white text-xs py-2 px-4 rounded-lg text-center shadow-lg animate-bounce">
                Credenciales incorrectas (admin@gantt.com / 123456)
            </div>
        </template>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-[#EEF2FF] rounded-xl mb-4">
                <i data-lucide="layout-grid" class="text-[#0D3BBD] w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-[#111827]">Gantt</h1>
            <p class="text-sm text-gray-500 mt-2">Sign in to manage your projects</p>
        </div>

        <button type="button" class="btn-outline mb-6">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
            Sign in with Google
        </button>

        <div class="relative mb-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-100"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-white px-4 text-gray-400 font-bold tracking-widest">Or email</span>
            </div>
        </div>

        <form @submit.prevent="submitLogin()" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-2">Email
                    Address</label>
                <input type="email" x-model="email" class="input-auth" placeholder="email@example.com" required>
            </div>

            <div x-data="{ show: false }">
                <div class="flex justify-between mb-2">
                    <label class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Password</label>
                    <a href="#" class="text-xs font-semibold text-[#0D3BBD] hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <input :type="show ? 'text' : 'password'" x-model="password" class="input-auth pr-10"
                        placeholder="••••••••" required>
                    <button type="button" @click="show = !show"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400">
                        <i :data-lucide="show ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full mt-4">
                Sign In
            </button>
        </form>

        <footer class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-sm text-gray-500">
                New here?
                <button hx-get="/src/views/auth/register.html" hx-target="#app-container"
                    class="font-bold text-[#0D3BBD] hover:underline">
                    Create an account
                </button>
            </p>
        </footer>
    </div>
</section>

<script>lucide.createIcons();</script>
