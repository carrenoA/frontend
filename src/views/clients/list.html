<div class="flex min-h-screen bg-[#F9FAFB] animate-in fade-in duration-500">
    <div hx-get="src/partials/sidebar.html" hx-trigger="load" hx-target="this" hx-swap="outerHTML"></div>

    <main class="flex-1 p-8 overflow-y-auto" x-data="{ showModal: false, modalTitle: 'Create New Client' }">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Clients</h1>
            </div>
            <div class="flex gap-4 items-center">
                <button @click="showModal = true"
                    class="btn-primary !w-auto py-2 px-6 shadow-md shadow-blue-100 flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Create New Client
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="card p-6">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Total Partners</p>
                <div class="flex items-end justify-between">
                    <h3 class="text-4xl font-black text-gray-900">42</h3>
                    <span class="text-[11px] text-blue-500 font-bold mb-1">+12% this month</span>
                </div>
            </div>
            <div class="card p-6">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Average Retention</p>
                <div class="flex items-end justify-between">
                    <h3 class="text-4xl font-black text-gray-900">94%</h3>
                    <i data-lucide="trending-up" class="text-orange-500 w-6 h-6 mb-1"></i>
                </div>
            </div>
        </div>

        <section class="card overflow-hidden mb-10" hx-get="src/components/user-table.html" hx-trigger="load"
            hx-swap="innerHTML">
            <div class="p-12 flex justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0D3BBD]"></div>
            </div>
        </section>

        <!-- modal -->

        <div x-show="showModal"
            class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/20 backdrop-blur-sm"
            x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" x-cloak>

            <div @click.away="showModal = false"
                class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl relative p-10 animate-in zoom-in duration-300">

                <button @click="showModal = false"
                    class="absolute top-8 right-8 text-gray-400 hover:text-gray-900 transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <div class="mb-8">
                    <span
                        class="inline-block px-3 py-1 bg-blue-50 text-[#0D3BBD] text-[10px] font-black uppercase tracking-widest rounded-lg mb-4">New
                        Entry</span>
                    <h2 class="text-3xl font-black text-gray-900 tracking-tight" x-text="modalTitle"></h2>
                </div>

                <form class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Name</label>
                        <input type="text" placeholder="Fullname"
                            class="w-full px-6 py-4 bg-gray-50 border-none rounded-[1.2rem] text-sm focus:ring-2 focus:ring-blue-100 outline-none font-semibold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Email</label>
                        <input type="email" placeholder="email@example.com"
                            class="w-full px-6 py-4 bg-gray-50 border-none rounded-[1.2rem] text-sm focus:ring-2 focus:ring-blue-100 outline-none font-semibold">
                    </div>
                    <button type="button" @click="$dispatch('notify', { message: 'Client initialized successfully!', type: 'success' }); showModal = false"
                        class="w-full bg-[#0D3BBD] text-white py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-blue-200 mt-4 hover:scale-[1.02] transition-transform">
                        Initialize Client
                    </button>
                </form>
            </div>
        </div>


    </main>
</div>
<script>lucide.createIcons();</script>
